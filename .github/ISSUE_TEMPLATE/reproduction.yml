name: Reproduction problem
description: Report a problem with a documented reproduction command
body:
  - type: textarea
    attributes:
      label: Version and command
      description: Tag/commit, exact command and intended result
    validations:
      required: true
  - type: textarea
    attributes:
      label: Environment and resource hashes
      description: OS, Python, dependencies, CUDA/GPU and source hashes
    validations:
      required: true
  - type: textarea
    attributes:
      label: Error and actual result
      description: Remove credentials, personal information and private data
    validations:
      required: true
