name: Public resource links
on:
  schedule:
    - cron: '17 2 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pinned-links:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: python tools/check_links.py
