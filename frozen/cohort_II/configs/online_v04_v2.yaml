protocol_version: cagr-online-v04-v2-stage-batch-fixed-gates
paper_type: methodology
seed: 42
base_protocol: configs/experiment.yaml
upgrade_protocol: configs/upgrade_v02.yaml
execution_policy: configs/execution_policy.yaml
router: configs/router_v04_pareto.json
baselines: configs/baselines_v04_online.json
partitions:
- smoke
- calibration
smoke_questions: 20
calibration_questions: 200
held_out_test: forbidden
methods:
- direct
- always_rag
- always_multihop
- binary_gate
- targ_style
- sugar_l_style_budgeted
- cagr
- cagr_in_situ
- cagr_doc_bridge
- cagr_compact
method_order: seed42_rotating_counterbalance
max_automatic_retries: 0
runtime_entry_enabled: true
submission_authority: await_current_user_confirmation_before_20_then_200
common_budget:
  max_input_tokens_per_call: 4096
  max_answer_tokens: 64
  max_rewrite_tokens: 48
  max_retrieval_calls: 2
  max_total_output_tokens: 181
  max_total_input_tokens: 16384
  reserve_final_answer_tokens: 64
quality_acceptance:
  comparator: always_rag
  metrics:
  - em
  - f1
  per_dataset_mean_difference_min: -0.01
  confidence_interval_is_noninferiority_hard_gate: false
paired_bootstrap:
  seed: 42
  replicates: 20000
  confidence: 0.95
  quality_recovery_comparators:
  - binary_gate
  - targ_style
  latency_retrieval_comparators:
  - always_rag
  - always_multihop
  - sugar_l_style_budgeted
  overhead_one_sided_upper_ratio: 0.005
  overhead_bonferroni_hard_gate: false
technical:
  forced_paths_separately_labelled: true
  paired_full_path_features_on_off: true
  prefix_cache_token_equality: true
  reject_multiple_prefill: true
  strict_v1_reference_methods:
  - cagr
  - cagr_in_situ
  - binary_gate
  - targ_style
  expected_decisions: 1058
  strict_same_GPU_numeric_equality: true
  synthetic_GPU_signal_gate_before_smoke: true
runtime:
  torch_required: 2.11.0+cu128
  cuda_required: '12.8'
  python_major_minor: '3.13'
  gpu_count: 2
  gpu_name_contains: T4
  device: cuda:0
  batch: 1
  concurrency: 1
  wall_budget_seconds: 10800
assets:
  runtime_downloads: false
  copy_verified_index_to_working: true
  new_private_asset_upload: false
entry: scripts/run_online_v04_v2.py
signal_implementation: stage_end_batch
freeze_main_only_after_complete_GPU_criteria: true
v2_upgrade_arms:
  doc_bridge:
    rule_source: scripts/v04_v2_queries.py
    learned_parameters: false
    status: exploratory_fixed_rule
  compact:
    documents: 3
    tokens_per_document: 96
    max_output_tokens: 24
    priority: main_cost_candidate
    new_queries_and_answers_required: true
freeze_targets:
  mean_latency_ms: 580
  stretch_latency_ms: 550
  overhead_upper_ratio: 0.005
  quality_per_dataset_EM_F1_mean_min_vs_rag: -0.01
  predeclared_priority:
  - cagr_compact
  - cagr
  - cagr_doc_bridge
  no_new_head_or_threshold_fitting: true
